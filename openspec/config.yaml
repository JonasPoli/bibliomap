schema: spec-driven

# Contexto do projeto: só restrições que um agente não descobre lendo o código.
# Documentos de apoio em docs/: Classificacao-Tematica-Guia.md, grupo-tematico-plus.md, matrizes.md,
# tesauros.md, roniberto/thesauros.md (formato .the do VantagePoint) e main.md (planejamento original,
# desatualizado em partes). O README lista os comandos app:*.
context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Projeto: BiblioMap, plataforma web de análise bibliométrica. Importa exportações da Web of Science,
  Scopus, Lens.org e PubMed; normaliza autores, instituições, países e palavras-chave por tesauro;
  gera relatórios, redes de coocorrência, mapa e evolução temática, classificação temática, matrizes e Qualis.
  Projeto acadêmico do Jonas (mestrado no PPGCTS/UFSCar; disciplina TIM/GTI 2026 do prof. Roniberto Morato
  do Amaral, que compartilhou os "Dados do CECH" em 08/2026). Não é cliente da WAB: não há cliente,
  contrato nem ticket no sistema WAB (busca em 09/11/2026). Os pedidos vêm do próprio Jonas.
  O repositório github.com/JonasPoli/bibliomap é PÚBLICO.

  Produção (conferida em 12/11/2026)
  - Servidor RunCloud compartilhado (1 vCPU, 2 GB de RAM) com outros apps, domínio bibliomap.wab.com.br, branch main.
    Os dados de acesso (IP, usuário SSH, caminhos do servidor, cron do painel) NÃO ficam neste repositório, que é
    público: estão na memória local do Claude Code do Jonas (servidor-producao-bibliomap). Quem não tiver essa
    memória pede o acesso ao Jonas.
  - Comando pesado (enriquecimento, tratamento de palavras-chave, importação grande) disputa a mesma CPU e o mesmo MySQL
    com os outros apps do servidor.
  - PHP 8.4, Symfony 7.4, MySQL 8.4 (a DATABASE_URL declara serverVersion=8.0), 17 comandos app:* (os de uso único foram
    removidos em 12/11/2026) e cache das análises (src/Service/Cache, var/cache/prod/pools).
  - .env.local do servidor tem APP_ENV=prod, DATABASE_URL, APP_SECRET, MAILER_DSN, EMAIL_FROM, EMAIL_CONTACT_TO, TINYMCE
    e DATABASE_BACKUP_DIR. Segredo de produção fica só no .env.local do servidor, nunca no .env versionado. Valores nunca
    exibidos.
  - Leitura livre; escrita só com aprovação do Jonas. Nunca fazer requisição HTTP que execute algo.
  - Cerca de 104 mil documentos, 7 projetos e 8 usuários. As tabelas de autoridade (keyword,
    palavra_chave_variacoes_nome, thesaurus_*, author_identity, instituicoes_ensino, paises, qualis_journal)
    são globais: mudar uma delas muda os números de todos os projetos.
  - A importação roda em segundo plano: o controller dispara nohup bin/console app:import:dataset (Process).
    Por isso exec e proc_open precisam estar liberados no disable_functions do pool do PHP; não bloquear.
    Log em var/log/import_{dataset}.log; arquivos enviados em var/uploads/{projeto}/ (fora do git).
  - Não há worker do Messenger nem envio de e-mail no código.
  - O cron do painel (qualis, backup e tratamento de palavras-chave) está descrito na mudança cron-do-painel-corrigido.
  - A classificação temática lê os documentos em lotes (12/11/2026); a medição no projeto de 50 mil documentos em
    produção ainda está pendente (tarefa 3.4 da mudança revisao-seguranca-desempenho-2026-11).

  Deploy
  - Local: commits pequenos por tema, direto na main, e git push origin main.
  - Servidor, como o usuário dono do webapp, na raiz do webapp: git pull --ff-only origin main; ./build.sh --prod;
    <php do pool> bin/console doctrine:migrations:migrate --no-interaction (o build só avisa as migrations pendentes).
  - build.sh --prod apaga var/cache/* e public/assets/*, roda composer install --no-dev, recompila os assets
    e apaga var/log/*.log com mais de 7 dias (inclui os import_*.log).
  - Antes de migration que altera dados: mysqldump na pasta de backups do servidor (credenciais da DATABASE_URL, sem imprimir).
  - Banco local: MySQL 8 "bibliomap". Tabelas antigas em utf8mb4_0900_ai_ci e novas em utf8mb4_unicode_ci:
    comparar texto entre elas exige COLLATE explícito.

  Decisões que não se revertem
  - O termo original importado nunca é apagado (document_keyword.original_term, nomes originais de autor).
  - Cálculos seguem o Bibliometrix (zonas de Bradford, mapa temático por força de associação + Louvain,
    centralidade e densidade de Callon). Mudar o método exige referência e comparação com um projeto real.
  - Classificação temática busca termos por trecho de texto, sem diferenciar maiúsculas; reexecutar apaga
    os resultados e as movimentações manuais (documentado na ajuda do sistema).
  - Projeto público é visto por qualquer usuário logado que tenha o link; só o dono altera.
    Cadastro novo fica pendente até um administrador aprovar.
  - Toda tela tem ajuda contextual "?" vinda de config/help/*.yaml (o HelpCatalogTest exige a chave e os
    campos title, what, how, not e example).

rules:
  design:
    - Quando tocar em produção, dizer se a ação é leitura ou escrita.
    - Mudança em cálculo bibliométrico cita o método de referência e mostra o efeito nos números de um projeto real.
    - Mudança em tabela de autoridade global diz o efeito em todos os projetos.
  tasks:
    - Toda tarefa que muda servidor ou banco de produção tem uma tarefa de backup antes e uma de conferência depois.
    - Rodar vendor/bin/phpunit antes de cada commit.
    - Tela nova ou alterada cria ou atualiza a entrada de ajuda em config/help/*.yaml.
    - Comando no servidor roda como o usuário dono do webapp com o PHP do pool; cron novo ou corrigido é
      tarefa no painel RunCloud, com o binário do PHP chamado direto (sem /bin/bash) e --env=prod.
    - Nada de segredo, dado pessoal ou arquivo de corpus no commit, porque o repositório é público.
