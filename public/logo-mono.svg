<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Monochromatic version — works on any color background via currentColor -->

  <!-- Connection lines -->
  <line x1="50" y1="50" x2="50" y2="18" stroke="currentColor" stroke-width="2"   stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="50" y1="50" x2="22" y2="74" stroke="currentColor" stroke-width="2"   stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="50" y1="50" x2="78" y2="74" stroke="currentColor" stroke-width="2"   stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="50" y1="50" x2="16" y2="40" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.55"/>
  <line x1="50" y1="50" x2="84" y2="40" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.55"/>
  <line x1="50" y1="18" x2="84" y2="40" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.35"/>
  <line x1="50" y1="18" x2="16" y2="40" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.35"/>
  <line x1="22" y1="74" x2="78" y2="74" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.30"/>

  <!-- Center glow ring -->
  <circle cx="50" cy="50" r="13" fill="currentColor" fill-opacity="0.12"/>

  <!-- Center node -->
  <circle cx="50" cy="50" r="9" fill="currentColor"/>

  <!-- Satellite nodes -->
  <circle cx="50" cy="18" r="6" fill="currentColor"/>
  <circle cx="22" cy="74" r="6" fill="currentColor"/>
  <circle cx="78" cy="74" r="6" fill="currentColor"/>

  <!-- Accent nodes -->
  <circle cx="16" cy="40" r="3.5" fill="currentColor" fill-opacity="0.75"/>
  <circle cx="84" cy="40" r="3.5" fill="currentColor" fill-opacity="0.75"/>
</svg>
