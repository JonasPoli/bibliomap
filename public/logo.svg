<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3b82f6"/>
      <stop offset="50%"  stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Connection lines (drawn first, behind nodes) -->
  <!-- Center to top -->
  <line x1="50" y1="50" x2="50" y2="18" stroke="url(#g1)" stroke-width="2" stroke-linecap="round"/>
  <!-- Center to bottom-left -->
  <line x1="50" y1="50" x2="22" y2="74" stroke="url(#g1)" stroke-width="2" stroke-linecap="round"/>
  <!-- Center to bottom-right -->
  <line x1="50" y1="50" x2="78" y2="74" stroke="url(#g1)" stroke-width="2" stroke-linecap="round"/>
  <!-- Center to left -->
  <line x1="50" y1="50" x2="16" y2="40" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <!-- Center to right -->
  <line x1="50" y1="50" x2="84" y2="40" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <!-- Peripheral connections -->
  <line x1="50" y1="18" x2="84" y2="40" stroke="url(#g1)" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.4"/>
  <line x1="50" y1="18" x2="16" y2="40" stroke="url(#g1)" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.4"/>
  <line x1="22" y1="74" x2="78" y2="74" stroke="url(#g1)" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.35"/>

  <!-- Glow rings on center -->
  <circle cx="50" cy="50" r="13" fill="url(#g2)"/>

  <!-- Center node (hexagonal-ish with clip) -->
  <circle cx="50" cy="50" r="9" fill="url(#g1)"/>
  <!-- Center node inner highlight -->
  <circle cx="46" cy="46" r="3" fill="white" fill-opacity="0.25"/>

  <!-- Satellite nodes -->
  <!-- Top -->
  <circle cx="50" cy="18" r="6" fill="url(#g1)"/>
  <circle cx="48" cy="16" r="2" fill="white" fill-opacity="0.3"/>

  <!-- Bottom-left -->
  <circle cx="22" cy="74" r="6" fill="url(#g1)"/>
  <circle cx="20" cy="72" r="2" fill="white" fill-opacity="0.3"/>

  <!-- Bottom-right -->
  <circle cx="78" cy="74" r="6" fill="url(#g1)"/>
  <circle cx="76" cy="72" r="2" fill="white" fill-opacity="0.3"/>

  <!-- Small accent nodes -->
  <circle cx="16" cy="40" r="3.5" fill="url(#g1)" fill-opacity="0.85"/>
  <circle cx="84" cy="40" r="3.5" fill="url(#g1)" fill-opacity="0.85"/>
</svg>
