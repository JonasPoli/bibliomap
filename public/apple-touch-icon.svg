<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <!-- Apple Touch Icon — dark background + logo centered -->
  <rect width="180" height="180" rx="40" fill="#0d1117"/>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3b82f6"/>
      <stop offset="50%"  stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Lines -->
  <line x1="90" y1="90" x2="90"  y2="38"  stroke="url(#g)" stroke-width="5"   stroke-linecap="round"/>
  <line x1="90" y1="90" x2="42"  y2="138" stroke="url(#g)" stroke-width="5"   stroke-linecap="round"/>
  <line x1="90" y1="90" x2="138" y2="138" stroke="url(#g)" stroke-width="5"   stroke-linecap="round"/>
  <line x1="90" y1="90" x2="30"  y2="72"  stroke="url(#g)" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="90" y1="90" x2="150" y2="72"  stroke="url(#g)" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="90" y1="38" x2="150" y2="72"  stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.4"/>
  <line x1="90" y1="38" x2="30"  y2="72"  stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.4"/>
  <line x1="42" y1="138" x2="138" y2="138" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.35"/>

  <!-- Center glow -->
  <circle cx="90" cy="90" r="27" fill="url(#g)" fill-opacity="0.15"/>
  <!-- Center node -->
  <circle cx="90" cy="90" r="18" fill="url(#g)"/>
  <circle cx="84" cy="84" r="5"  fill="white" fill-opacity="0.25"/>

  <!-- Satellite nodes -->
  <circle cx="90"  cy="38"  r="12" fill="url(#g)"/>
  <circle cx="42"  cy="138" r="12" fill="url(#g)"/>
  <circle cx="138" cy="138" r="12" fill="url(#g)"/>

  <!-- Accent nodes -->
  <circle cx="30"  cy="72" r="7.5" fill="url(#g)" fill-opacity="0.85"/>
  <circle cx="150" cy="72" r="7.5" fill="url(#g)" fill-opacity="0.85"/>
</svg>
