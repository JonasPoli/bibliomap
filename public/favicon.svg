<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    BiblioMap favicon — optimized for 16×16, 32×32, 64×64
    Uses thicker strokes and simpler shape for readability at small sizes
  -->
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Lines (simplified for small sizes) -->
  <line x1="16" y1="16" x2="16" y2="5"  stroke="url(#fg)" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="6"  y2="24" stroke="url(#fg)" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="26" y2="24" stroke="url(#fg)" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="4"  y2="13" stroke="url(#fg)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="16" y1="16" x2="28" y2="13" stroke="url(#fg)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Center glow -->
  <circle cx="16" cy="16" r="5.5" fill="url(#fg)" fill-opacity="0.2"/>
  <!-- Center node -->
  <circle cx="16" cy="16" r="3.5" fill="url(#fg)"/>

  <!-- Satellite nodes -->
  <circle cx="16" cy="5"  r="2.8" fill="url(#fg)"/>
  <circle cx="6"  cy="24" r="2.8" fill="url(#fg)"/>
  <circle cx="26" cy="24" r="2.8" fill="url(#fg)"/>

  <!-- Accent nodes -->
  <circle cx="4"  cy="13" r="1.8" fill="url(#fg)" fill-opacity="0.8"/>
  <circle cx="28" cy="13" r="1.8" fill="url(#fg)" fill-opacity="0.8"/>
</svg>
